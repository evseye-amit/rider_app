name: evseye_core
description: Shared design system, dynamic JSON-driven UI engine and core utilities for the EVSEYE apps.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.10.0
  cupertino_ui: ^1.1.6
  flutter_riverpod: ^3.5.0
  equatable: ^3.0.0
  intl: ^0.20.3
  flutter_svg: ^2.3.2

  # networking
  dio: ^5.11.1

  # API logging
  pretty_dio_logger: ^1.4.0

  # Camera capture and gallery selection for document upload
  image_picker: ^1.2.4
  shared_preferences: ^2.5.6
  pinput: ^7.0.0
  webview_flutter: ^4.14.1
  xml: ^7.0.1

  # push notifications
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  assets:
    - assets/art/
