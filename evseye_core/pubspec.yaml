name: evseye_core
description: Shared design system, dynamic JSON-driven UI engine and core utilities for the EVSEYE apps.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.10.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  equatable: ^2.0.7
  intl: ^0.20.2
  go_router: ^14.8.1
  flutter_bloc: ^9.1.0
  get_it: ^8.0.3
  flutter_svg: ^2.0.17

  # networking
  dio: ^5.7.0

  # API logging
  pretty_dio_logger: ^1.4.0

  # Camera capture and gallery selection for document upload
  image_picker: ^1.1.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/art/
