name: evseye_core
description: Shared design system, dynamic JSON-driven UI engine and core utilities for the EVSEYE apps.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.10.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  equatable: ^3.0.0
  intl: ^0.20.2
  flutter_svg: ^2.0.17

  # networking
  dio: ^5.7.0

  # API logging
  pretty_dio_logger: ^1.4.0

  # Camera capture and gallery selection for document upload
  image_picker: ^1.1.2
  shared_preferences: ^2.5.3
  pinput: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  assets:
    - assets/art/
