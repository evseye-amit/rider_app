name: fleet_manager_app
description: EVSEYE Fleet Manager — hub operations, allocation, de-allocation and maintenance.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  evseye_core:
    path: ../evseye_core

  # state
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  get_it: ^8.0.3

  # navigation
  go_router: ^14.8.1

  # platform
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  intl: ^0.20.2
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/config/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
        - asset: assets/fonts/Sora-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/images/app_icon.png
  # White, because that is the logo's own ground — the pin is drawn on paper,
  # and putting it on the old midnight square left a pink mark floating on a
  # colour the brand no longer uses anywhere.
  adaptive_icon_background: "#FFFFFF"
  # A separate, transparent, full-bleed copy of the mark. `app_icon.png` has
  # the white baked in, so using it as the foreground would paint a white
  # square inside the adaptive layer and show the background only as a border.
  adaptive_icon_foreground: assets/images/app_icon_foreground.png
  # Applied as an <inset> drawable, which is why the foreground bitmap is
  # full-bleed: 20% on each side leaves the mark at 60% of the layer, inside
  # the 66% circle every launcher mask is guaranteed to keep.
  adaptive_icon_foreground_inset: 20

flutter_native_splash:
  # The native launch screen shows the same poster the Dart splash does, on
  # the poster's own paper white, so nothing changes colour between the OS
  # screen and the first frame.
  #
  # `image` rather than `background_image`: a background image is painted with
  # android:gravity="fill", which stretches it to the window. The poster is
  # 4:5 and a phone is nearer 9:19.5, so filling it would squash the mark out
  # of shape. Centred and undistorted is the honest option, and on iOS
  # `scaleAspectFit` reproduces the Dart splash's BoxFit.contain exactly.
  color: "#FFFFFF"
  image: assets/images/splash_screen.png
  ios_content_mode: scaleAspectFit
  android_12:
    # Android 12+ forces a centred icon on a solid ground — an arbitrary
    # poster is ignored there, so the launcher mark on white is the closest
    # match the platform allows.
    image: assets/images/android12_splash_icon.png
    color: "#FFFFFF"
    icon_background_color: "#FFFFFF"
  android: true
  ios: true
  web: false
  fullscreen: true
