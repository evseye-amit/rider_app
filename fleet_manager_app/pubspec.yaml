name: fleet_manager_app
description: Pink FM app — hub operations, allocation, de-allocation and maintenance.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  evseye_core:
    path: ../evseye_core

  # state
  flutter_riverpod: ^3.3.2
  equatable: ^3.0.0

  # navigation
  go_router: ^17.5.0

  # platform
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  intl: ^0.20.2
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/config/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
        - asset: assets/fonts/Sora-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/images/app_icon.png
  # White, because that is the logo's own ground — the pin is drawn on paper,
  # and putting it on the old midnight square left a pink mark floating on a
  # colour the brand no longer uses anywhere.
  adaptive_icon_background: "#FFFFFF"
  # A separate, transparent, full-bleed copy of the mark. `app_icon.png` has
  # the white baked in, so using it as the foreground would paint a white
  # square inside the adaptive layer and show the background only as a border.
  adaptive_icon_foreground: assets/images/app_icon_foreground.png
  # Applied as an <inset> drawable, which is why the foreground bitmap is
  # full-bleed: 20% on each side leaves the mark at 60% of the layer, inside
  # the 66% circle every launcher mask is guaranteed to keep.
  adaptive_icon_foreground_inset: 20

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/app_icon_foreground.png
  android_12:
    color: "#FFFFFF"
    icon_background_color: "#FFFFFF"
  android: true
  ios: true
  web: false
