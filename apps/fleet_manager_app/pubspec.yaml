name: fleet_manager_app
description: Fleet manager app — hub operations, allocation, de-allocation and maintenance.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.10.0
  cupertino_icons: ^2.0.0
  flutter_native_splash: ^2.4.8

  evseye_core:
    path: ../../packages/evseye_core

  # state
  flutter_riverpod: ^3.5.0
  equatable: ^3.0.0

  # navigation
  go_router: ^18.1.3

  # platform
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  intl: ^0.20.3
  flutter_svg: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  evseye_flavors:
    path: ../../packages/evseye_flavors

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/config/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
        - asset: assets/fonts/Sora-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/images/app_icon.png
  # White, because that is the logo's own ground — the pin is drawn on paper,
  # and putting it on the old midnight square left a pink mark floating on a
  # colour the brand no longer uses anywhere.
  adaptive_icon_background: "#FFFFFF"
  # A separate, transparent, full-bleed copy of the mark. `app_icon.png` has
  # the white baked in, so using it as the foreground would paint a white
  # square inside the adaptive layer and show the background only as a border.
  adaptive_icon_foreground: assets/images/app_icon_foreground.png
  # Applied as an <inset> drawable, which is why the foreground bitmap is
  # full-bleed: 20% on each side leaves the mark at 60% of the layer, inside
  # the 66% circle every launcher mask is guaranteed to keep.
  adaptive_icon_foreground_inset: 20

flutter_native_splash:
  color: "#FFF5FA"
  image: assets/images/app_icon_foreground.png
  branding: assets/images/splash_branding.png
  branding_mode: bottom
  android_12:
    color: "#FFF5FA"
    image: assets/images/app_icon_foreground_splash.png
    branding: assets/images/splash_branding.png
  android: true
  ios: true
  web: false
